name: Java CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-jar
          path: target/*.jar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jonnagaddalavaishnavi
          password: UeVwr2-YXUn*!iN

      - name: Build Docker image
        run: docker build -t jonnagaddalavaishnavi/calculator:latest .

      - name: Push Docker image
        run: docker push jonnagaddalavaishnavi/calculator:latest




